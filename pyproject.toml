[project]
name = "bank-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "actualpy>=0.22.1",
    "apscheduler>=3.10,<4",
    "cryptography>=47.0.0",
    "flask>=3.1.3",
    "pyjwt[crypto]>=2.12.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
