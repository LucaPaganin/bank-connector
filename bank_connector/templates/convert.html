<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JSON → CSV — Bank Connector</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  .container { max-width: 620px; margin: 2rem auto; padding: 0 1rem; }
  a.back { font-size: 0.85rem; color: #6b7280; text-decoration: none; display: inline-block; margin-bottom: 1.25rem; }
  a.back:hover { color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 1.5rem 1.75rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-top: 1.1rem; margin-bottom: 0.3rem; }
  label:first-of-type { margin-top: 0; }
  textarea {
    width: 100%; min-height: 220px; padding: 0.6rem 0.7rem; border: 1px solid #d1d5db;
    border-radius: 4px; font-size: 0.8rem; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: #fff; resize: vertical;
  }
  input[type=file] { font-size: 0.85rem; }
  textarea:focus {
    outline: none; border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,.15);
  }
  .hint { font-size: 0.75rem; color: #6b7280; margin-top: 0.3rem; }
  .btn {
    display: block; width: 100%; margin-top: 1.5rem;
    padding: 0.6rem; background: #2563eb; color: #fff;
    border: none; border-radius: 4px; cursor: pointer;
    font-size: 0.875rem; font-family: inherit; font-weight: 600;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #93c5fd; cursor: default; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="/">← Dashboard</a>
  <h1>JSON → CSV Converter</h1>
  <div class="card">

    <label for="file">Upload a raw JSON file</label>
    <input type="file" id="file" accept=".json,application/json" onchange="loadFile(this)">

    <label for="json">…or paste raw Enable Banking JSON</label>
    <textarea id="json" placeholder='[ { "booking_date": "...", "transaction_amount": { "amount": "1.23" }, ... } ]'></textarea>
    <p class="hint">
      Accepts either a bare array of transactions or the export envelope
      (an object with a <code>transactions</code> key). Output is the Actual
      Budget CSV format (Date, Payee, Notes, Amount, Ref, Status).
    </p>

    <button type="button" class="btn" id="go" onclick="convert(this)">
      Convert &amp; Download CSV
    </button>
  </div>
</div>
<script>
function loadFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { document.getElementById('json').value = reader.result; };
  reader.readAsText(f);
}

async function convert(btn) {
  const text = document.getElementById('json').value.trim();
  if (!text) { alert('Paste or upload some JSON first.'); return; }
  try { JSON.parse(text); }
  catch (e) { alert('That is not valid JSON: ' + e.message); return; }

  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Converting…';
  try {
    const resp = await fetch('/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: text,
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert('Convert failed (' + resp.status + '): ' + msg.slice(0, 300));
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'converted.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Convert error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}
</script>
</body>
</html>
